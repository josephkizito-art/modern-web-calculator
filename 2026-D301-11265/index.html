<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <div class="display">0</div>

        <div class="keys">

            <div class="key light">AC</div>
            <div class="key light">00</div>
            <div class="key light">%</div>
            <div class="key operator">÷</div>

            <div class="key">7</div>
            <div class="key">8</div>
            <div class="key">9</div>
            <div class="key operator">x</div>

            <div class="key">4</div>
            <div class="key">5</div>
            <div class="key">6</div>
            <div class="key operator">−</div>

            <div class="key">1</div>
            <div class="key">2</div>
            <div class="key">3</div>
            <div class="key operator">+</div>

            <div class="key wide">0</div>
            <div class="key">.</div>
            <div class="key operator">=</div>

        </div>
    </div>

</body>
</html>
